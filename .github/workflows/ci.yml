name: CI & SEO Verification

on:
  push:
    branches: [ main, seo/* ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Astro check & Build
        run: npm run build

      - name: Verify SEO Integrity (hreflang, canonicals, sitemap, schema images)
        run: npm run verify:seo
